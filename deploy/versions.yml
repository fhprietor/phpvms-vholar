# Manifiesto de versiones de la instalacion Vholar.
#
# Cada tag de release del repo debe congelar exactamente este contenido. Si un
# despliegue no coincide con este fichero, no es reproducible.

release: vholar-1.0.0

phpvms:
  upstream: https://github.com/phpvms/phpvms
  base_tag: 7.0.5
  base_commit: 68efe7ce
  fork: https://github.com/fhprietor/phpvms-vholar
  branch: custom-vholar

theme:
  name: vholar
  extends: null
  path: resources/views/layouts/vholar
  provider: app/Themes/Vholar/ThemeServiceProvider.php
  assets:
    - public/disposable
    - public/image
    - public/images
    - public/assets/themes
    - public/assets/admin/css/vholar-admin.css

modules:
  # Estado real segun Nwidart en el momento de escribir este manifiesto.
  # OJO: el fichero de estados (config/modules_statuses.json) NO esta en el repo,
  # asi que la activacion/desactivacion no se reproduce sola: hay que aplicarla.
  enabled:
    - Awards
    - DisposableBasic
    - DisposableSpecial
    - Sample
    - SmartCARS3phpVMS7Api
    - Vacentral
    - VmsOpenFileManager
    - VmsOpenOps
  disabled:
    - CHJumpSeat
    - TestABC
  items:
    DisposableBasic:
      origin: submodule
      url: https://github.com/FatihKoz/DisposableBasic.git
      commit: f0b03db5bef7a5b7ea08e93ef07e3e86d9f3cbfd
      describe: v3.7.4-2-gf0b03db
      module_json_version: 3.7.4
    DisposableSpecial:
      origin: vendored
      upstream: https://github.com/FatihKoz/DisposableSpecial.git
      base_commit: d1d776cea9d4e6453dad99e59b18f3f3a9ddd153
      module_json_version: 3.7.8
      local_patch: patches/DisposableSpecial-d1d776c.patch
      pending: extraer a fork propio y pinar como submodulo
    CHJumpSeat:
      origin: vendored
      upstream: https://github.com/cardinalhorizon/CHJumpSeat.git
      base_commit: 97193a62a2293e444bcc84ef449643d01ef5377e
      license: comercial (Cardinal Horizon) - solo uso interno en repo privado
      local_patch: patches/CHJumpSeat-97193a6.patch
      pending: extraer a fork propio y pinar como submodulo
    SmartCARS3phpVMS7Api:
      origin: in-repo
      module_json_version: 1.0.2
    VmsOpenOps:
      origin: in-repo
      module_json_version: null
      pending: extraer a repo propio y pinar como submodulo
    VmsOpenFileManager:
      origin: in-repo
      module_json_version: null
      pending: extraer a repo propio y pinar como submodulo
    TestABC:
      origin: in-repo
      module_json_version: null
    Awards:
      origin: in-repo
    Sample:
      origin: in-repo
    Vacentral:
      origin: in-repo

settings:
  # Claves anadidas desde el fork; el valor real vive en la BD (Admin > Settings),
  # no en el repo. Ambas se siembran vacias y se rellenan a mano.
  added_by_vholar:
    - general.carto_api_key
    - general.navdata_api_key
  seed_file: app/Database/seeds/settings.yml

data_changes_not_in_code:
  # Cambios de datos puntuales que el repo NO reproduce.
  - date: 2026-09-29
    description: >
      Backfill de pireps.source_name: 5718 PIREPs a "CrewSystem/import" y 227 a
      "manual" (los que estaban vacios). Se aplico con query builder, sin tocar
      updated_at.
    follow_up: documentar en las notas del release o convertir en migracion

secrets_not_in_repo:
  - .env (APP_KEY, credenciales de BD, correo, webhooks de Discord)
  - Valor real de general.carto_api_key y general.navdata_api_key (esta en la BD)
  - storage/app/public/filemanager/**/vmsopenacarsexe.config (contiene la API key de NavData)

deploy:
  - git clone <fork> && git checkout <tag>
  - git submodule update --init --recursive
  - composer install --no-dev --optimize-autoloader
  - npm ci && npm run production
  - php artisan migrate --force
  - visitar /update   # sincroniza settings, permisos y modulos
  - php artisan cache:clear && php artisan view:clear && php artisan route:clear
  caveats:
    - >
      `php artisan migrate` global falla en la migracion del modulo
      VmsOpenFileManager (create_vmsopen_liveries_table) porque los modulos se
      re-registran como pendientes. Aplicar por --path si ocurre.
    - >
      El estado de activacion de modulos no esta versionado; aplicar la lista
      `modules.enabled` a mano tras el despliegue.
